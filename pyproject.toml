[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semantic-chunking-engine"
version = "0.1.0"
description = "Semantic chunking by embedding-distance breakpoints with token limits."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Juan Martos Cuevas", email = "martoscuevasjuan@gmail.com" }]
dependencies = [
    "numpy>=1.20",
]

[project.optional-dependencies]
local = ["sentence-transformers>=2.2", "torch>=2.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["semantic_chunking_engine"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
